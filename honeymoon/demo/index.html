<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCC Resort — Honeymoon Experience</title>
  <meta name="description" content="BCC Resort Honeymoon Experience. Your special experience is being prepared." />
  <link rel="canonical" href="https://honeymoon.hercules.my.id/honeymoon/demo/" />
  <style>
    :root {
      --bg: #0f0d0b;
      --ink: #f4efe7;
      --muted: #b8a98f;
      --gold: #c9a24b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #1c1712 0%, var(--bg) 70%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; }
    .rule {
      width: 3rem;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2rem;
      opacity: 0.8;
    }
    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.4rem;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: 0.02em;
      margin-bottom: 1.6rem;
    }
    .message {
      font-size: clamp(1rem, 3.4vw, 1.2rem);
      font-style: italic;
      color: var(--muted);
      line-height: 1.6;
    }
    .soon {
      margin-top: 2.6rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.75;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f2ea; --ink: #211b14; --muted: #6f6350; --gold: #9a7822; }
      body { background: radial-gradient(circle at 50% 30%, #fffdf9 0%, var(--bg) 72%); }
    }
  </style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <p class="brand">BCC Resort</p>
    <h1>Honeymoon Experience</h1>
    <p class="message">&ldquo;Your special experience is being prepared.&rdquo;</p>
    <p class="soon">Please return soon.</p>
  </main>
</body>
</html>
